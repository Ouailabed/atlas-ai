<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- ATLAS mark: the letter A built from two navigation paths rising to a shared
       apex, with the crossbar carrying the central intelligence node — one system
       coordinating what sits beneath it. Stroke-only geometry so it survives 16px. -->
  <rect width="32" height="32" rx="7" fill="#0B0D12"/>
  <g fill="none" stroke="#8AA2FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.6 25.4 L16 6.6 L25.4 25.4"/>
    <path d="M11.1 19.6 H20.9" stroke-opacity=".55"/>
  </g>
  <circle cx="16" cy="19.6" r="3" fill="#0B0D12"/>
  <circle cx="16" cy="19.6" r="2.5" fill="#8AA2FF"/>
</svg>
